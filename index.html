<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a1226">
<meta name="apple-mobile-web-app-title" content="STAR POST">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>STAR POST</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=19">
</head>
<body>
<div id="app">

<section id="onboard" class="screen show"><div class="stage">
  <h1>★ STAR POST ★</h1>
  <p class="ob-desc">도시의 밤에도 하늘엔 별이 있어요.<br>핸드폰을 하늘로 들어 올리면 지금 그 자리에<br>숨어있는 별들이 보여요.<br><br>오늘 밤, 자신의 별자리도 찾아보아요.</p>
  <button id="startBtn" class="btn white">하늘 보러 가기</button>
  <p class="ob-hint">위치 · 방향 센서 권한을 허용해 주세요.</p>
</div></section>

<section id="sky" class="screen">
  <div id="skyBg"></div>
  <video id="cam" autoplay muted playsinline></video>
  <div id="tint"></div>
  <canvas id="stars"></canvas>
  <div class="stage">
  <div class="pill" id="hudPlace">위치 찾는 중…</div>
  <div class="pill" id="hudDir">--</div>
  <button class="pill dark" id="sensorBtn" hidden>방향 센서 켜기</button>
  <div id="hint" class="hint">핸드폰을 하늘로 들어 올려 보세요</div>
  <div id="machine" hidden>
    <img src="img/machine.png" alt="">
    <canvas id="mPrev"></canvas>
    <button id="pressBtn" aria-label="찍기"></button>
    <button id="mClose">닫기</button>
    <button id="zOut" class="zbtn">−</button><button id="zIn" class="zbtn">+</button>
  </div>
  <div id="conInfo" class="con-info"><span class="con-name"></span><span class="con-id"></span><div class="con-desc"></div></div>
  <button id="stampBtn" class="stamp-btn">별자리<br>우표 생성</button>
  <button id="postBtn" class="post-card">
    <span class="pc-label">엽서 만들기</span>
    <img class="seal-mini" src="img/seal.png" alt="">
    <div id="miniStamps"></div>
    <span class="chev"></span>
  </button>
  </div>
</section>

<div id="naming" class="overlay"><div class="stage">
  <button class="back" id="nClose" aria-label="뒤로"></button>
  <div class="n-stamp"><img id="nImg" alt="우표"><img id="nSeal" src="img/seal.png" alt=""></div>
  <input id="nName" type="text" placeholder="이름을 입력해 주세요." maxlength="20" autocomplete="off">
  <div class="n-line"></div>
  <div class="n-date" id="nDate"></div>
  <p class="n-hint">소중한 사람이나 자신의 별자리에 이름을 적어보세요.</p>
  <button id="nSave" class="btn dark">확인</button>
</div></div>

<section id="postcard" class="screen"><div class="scroll"><div class="stage">
  <button class="back" id="pcBack" aria-label="뒤로"></button>
  <canvas id="pcCanvas"></canvas>
  <p class="pc-hint2">줄을 누르면 글쓰기 · 우표를 누르면 옮기기 · 크기 · 지우기</p>
  <button id="pcSave" class="btn dark">이미지 저장하기</button>
</div></div>
  <div id="sheet" hidden>
    <label><span>with</span><input id="pcWith" type="text" placeholder="누구와 봤나요" maxlength="24"></label>
    <label><span>at</span><input id="pcWhere" type="text" placeholder="어디서 봤나요" maxlength="24"></label>
    <label><span>on</span><b id="pcDate"></b></label>
    <label><span>한마디</span><input id="pcMsg" type="text" placeholder="그날의 하늘을 적어 보세요" maxlength="50"></label>
    <button id="sheetDone" class="btn dark">완료</button>
  </div>
</section>

<div id="preview" class="overlay">
  <button class="back light" id="pvClose" aria-label="뒤로"></button>
  <div class="pv-body"><img id="pvImg" alt="엽서"><p>이미지를 길게 눌러 저장하세요</p></div>
</div>

</div>
<script src="data/sky.js?v=2"></script>
<script src="app.js?v=19"></script>
</body>
</html>
